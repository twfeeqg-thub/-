<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <rect width="512" height="512" rx="128" fill="#0f172a"/>
  <rect x="24" y="24" width="464" height="464" rx="104" stroke="#334155" stroke-width="8" stroke-dasharray="16 16"/>
  <!-- Central Badge with gradient -->
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="50%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <circle cx="256" cy="256" r="160" fill="url(#glow)"/>
  <!-- Break-even Delta symbol & scales -->
  <!-- Horizontal baseline: Break-even line in orange -->
  <line x1="120" y1="280" x2="392" y2="280" stroke="#f59e0b" stroke-width="14" stroke-linecap="round"/>
  <!-- Target profit price arrow up in green -->
  <path d="M336 210 L336 140 M306 170 L336 140 L366 170" stroke="#10b981" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Entry price marker in slate-300 -->
  <circle cx="176" cy="280" r="18" fill="#38bdf8"/>
  <!-- Test target price marker in emerald -->
  <circle cx="336" cy="140" r="14" fill="#10b981"/>
  <!-- Break-even center balance node in amber -->
  <polygon points="256,230 274,272 238,272" fill="#f59e0b"/>
  <!-- Calculator keys subtle outline -->
  <rect x="140" y="324" width="60" height="48" rx="10" fill="#1e293b" stroke="#475569" stroke-width="4"/>
  <rect x="226" y="324" width="60" height="48" rx="10" fill="#1e293b" stroke="#475569" stroke-width="4"/>
  <rect x="312" y="324" width="60" height="48" rx="10" fill="#f59e0b" fill-opacity="0.2" stroke="#f59e0b" stroke-width="4"/>
  <text x="256" y="420" font-family="system-ui, sans-serif" font-size="34" font-weight="bold" fill="#94a3b8" text-anchor="middle">V0 CALC</text>
</svg>
